[package]
name = "wzqlink"
version = "0.1.0"
description = "A Gomoku Study Assistant"
authors = ["zengsheng-git"]
edition = "2024"
# 发码工具(src/bin/license-keygen.rs)使 crate 存在多个 bin, 需显式指定默认运行目标
default-run = "wzqlink"

[lib]
name = "wzqlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.5.1", features = [] }
tauri-plugin-opener = "2.2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
xcap = { version = "0.5.1" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
tracing-appender = "0.2"
base64 = "0.22"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
opt-level = "s"
strip = true
